<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Card -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- L-Ruler Corner -->
  <path d="M 24 24 L 98 24 L 98 42 L 42 42 L 42 98 L 24 98 Z" fill="url(#rulerGrad)" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Horizontal Ticks -->
  <line x1="36" y1="24" x2="36" y2="34" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="50" y1="24" x2="50" y2="38" stroke="#38bdf8" stroke-width="2" />
  <line x1="64" y1="24" x2="64" y2="34" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="78" y1="24" x2="78" y2="38" stroke="#38bdf8" stroke-width="2" />
  <line x1="92" y1="24" x2="92" y2="34" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Vertical Ticks -->
  <line x1="24" y1="36" x2="34" y2="36" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="24" y1="50" x2="38" y2="50" stroke="#38bdf8" stroke-width="2" />
  <line x1="24" y1="64" x2="34" y2="64" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="24" y1="78" x2="38" y2="78" stroke="#38bdf8" stroke-width="2" />
  <line x1="24" y1="92" x2="34" y2="92" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Laser Crosshair with Glow -->
  <g filter="url(#neonGlow)">
    <line x1="50" y1="74" x2="102" y2="74" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <line x1="76" y1="48" x2="76" y2="100" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
    <circle cx="76" cy="74" r="14" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="76" cy="74" r="3" fill="#ffffff" />
  </g>
</svg>
